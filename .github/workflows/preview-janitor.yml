name: PR Preview Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  janitor:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-janitor.yml@865c74796c72dec7d9961249106ac9756af5f3c8
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the janitor writes the expiry warning in preview comments.
      pull-requests: write

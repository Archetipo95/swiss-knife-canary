name: PR Preview Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  janitor:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-janitor.yml@2dd057deb6ffd4a589ec7e3fe3ee7f782eb02f69
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the janitor writes the expiry warning in preview comments.
      pull-requests: write

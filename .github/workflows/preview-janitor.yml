name: PR Preview Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  janitor:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-janitor.yml@35163cb036779f508d2f2bc9ebe775805d15c672
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the janitor writes the expiry warning in preview comments.
      pull-requests: write

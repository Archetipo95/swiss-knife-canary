name: PR Preview Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  janitor:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-janitor.yml@0be244892b6c2ac5e3bab2a96a309c663ce170df
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the janitor writes the expiry warning in preview comments.
      pull-requests: write

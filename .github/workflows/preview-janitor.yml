name: PR Preview Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  janitor:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-janitor.yml@dd56dacab3dc7138851951cf3479a5c17ddc5076
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the janitor writes the expiry warning in preview comments.
      pull-requests: write

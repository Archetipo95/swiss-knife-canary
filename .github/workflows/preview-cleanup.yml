name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-cleanup.yml@2dd057deb6ffd4a589ec7e3fe3ee7f782eb02f69
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the cleanup marks the PR's preview comment as removed.
      pull-requests: write

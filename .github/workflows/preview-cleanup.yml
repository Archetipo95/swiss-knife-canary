name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-cleanup.yml@0be244892b6c2ac5e3bab2a96a309c663ce170df
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the cleanup marks the PR's preview comment as removed.
      pull-requests: write

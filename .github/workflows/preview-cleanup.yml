name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-cleanup.yml@dd56dacab3dc7138851951cf3479a5c17ddc5076
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the cleanup marks the PR's preview comment as removed.
      pull-requests: write

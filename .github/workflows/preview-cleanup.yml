name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-cleanup.yml@865c74796c72dec7d9961249106ac9756af5f3c8
    permissions:
      contents: write
      deployments: write
      pages: write
      # swiss-knife 0.4.0: the cleanup marks the PR's preview comment as removed.
      pull-requests: write

name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install and build Storybook
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec storybook build --quiet --output-dir storybook-static
      - name: Package and upload preview bundle
        uses: Archetipo95/storybook-github-swiss-knife/actions/preview-build@699c54b46da52c25cc2ff52a883a5a8c769d8625
        with:
          source_path: 'storybook-static'

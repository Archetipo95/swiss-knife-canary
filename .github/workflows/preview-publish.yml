name: PR Preview Publish

on:
  workflow_run:
    workflows: ['PR Preview Build']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-publish.yml@384e4f3d9d4f0e36a11adc49841d6c4b5b30d315
    permissions:
      actions: read
      contents: write
      deployments: write
      pages: write
      pull-requests: write
    secrets:
      passcode_hash: ${{ secrets.STORYBOOK_PREVIEW_PASSCODE_HASH }}

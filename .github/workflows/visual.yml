name: Visual

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: ['main']

# Label events get their own group, so a label never cancels a comparison.
concurrency:
  group: >-
    visual-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  visual:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/visual.yml@47e086ba3abc9601350c2021c8ebbb53f104d6d0
    permissions:
      contents: read
      actions: read

name: Visual Gate

on:
  workflow_run:
    workflows: ['Visual']
    types: [completed]

permissions:
  contents: read

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request'
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/visual-gate.yml@384e4f3d9d4f0e36a11adc49841d6c4b5b30d315
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write
    with:
      caller_workflow: .github/workflows/visual.yml
      # The capture settings are read from the pull request: keep them as reviewed on the base.
      protected_paths: '.storybook/swiss-knife.json'
    secrets:
      passcode_hash: ${{ secrets.STORYBOOK_PREVIEW_PASSCODE_HASH }}

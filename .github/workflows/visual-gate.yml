name: Visual Gate

on:
  workflow_run:
    workflows: ['Visual']
    types: [completed]

permissions:
  contents: read

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request'
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/visual-gate.yml@114eb93e045bf201cf32ff1da28e900517a53730
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write
    with:
      caller_workflow: .github/workflows/visual.yml
      # The capture settings are read from the pull request: keep them as reviewed on the base.
      protected_paths: '.storybook/swiss-knife.json'
    secrets:
      passcode_hash: ${{ secrets.STORYBOOK_PREVIEW_PASSCODE_HASH }}
